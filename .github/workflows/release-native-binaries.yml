name: Build native executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-amd64
            exe_ext: ''
          - os: macos-latest
            asset_suffix: macos-arm64
            exe_ext: ''
          - os: windows-latest
            asset_suffix: windows-amd64
            exe_ext: '.exe'

    env:
      RUBY_VERSION: '4.0.6'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Tebako CLI (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/tebako-dl"
          cd "$HOME/tebako-dl"

          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release download --repo tamatebako/tebako --pattern "*macos-arm64*"
          else
            gh release download --repo tamatebako/tebako --pattern "*linux-gnu-x86_64*"
          fi

          for tool in tebako-bootstrap tebako-pkg tebako-shim tebako tfs; do
            for file in "$tool"-*; do
              if [ -f "$file" ]; then
                cp "$file" "$HOME/.local/bin/$tool"
                chmod +x "$HOME/.local/bin/$tool"
                break
              fi
            done
          done

          rm -rf "$HOME/tebako-dl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tebako CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\tebako-bin"
          gh release download --repo tamatebako/tebako --pattern "*windows*" --dir "$HOME\tebako-bin"
          
          $tools = @('tebako-bootstrap', 'tebako-pkg', 'tebako-shim', 'tebako', 'tfs')
          Get-ChildItem -Path "$HOME\tebako-bin" -File | ForEach-Object {
              foreach ($tool in $tools) {
                  if ($_.Name -like "$tool-*windows*" -or $_.Name -like "$tool.*windows*") {
                      Copy-Item $_.FullName "$HOME\tebako-bin\$tool.exe" -Force
                      break
                  }
              }
          }
          "$HOME\tebako-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare packaging environment
        shell: bash
        run: |
          for f in *.gemspec; do
            [ -f "$f" ] && mv "$f" "$f.disabled"
          done

          [ -f Gemfile ] && cp Gemfile Gemfile.bak
          cat << 'EOF' > Gemfile
          source "https://rubygems.org"
          gem "concurrent-ruby", "~> 1.3", ">= 1.3.6"
          EOF

          rm -f Gemfile.lock
          bundle lock

      - name: Build executable (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ../dist
          DIST_DIR=$(cd ../dist && pwd)

          tebako press \
            --root=. \
            --entry-point=bin/wayback_machine_downloader \
            --output="$DIST_DIR/wayback_machine_downloader-${{ matrix.asset_suffix }}${{ matrix.exe_ext }}" \
            -R ${{ env.RUBY_VERSION }} \
            -m self-contained \
            --format dwarfs

          echo "ASSET_PATH=$DIST_DIR/wayback_machine_downloader-${{ matrix.asset_suffix }}${{ matrix.exe_ext }}" >> $GITHUB_ENV

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "..\dist"
          $outPath = (Resolve-Path "..\dist").Path + "\wayback_machine_downloader-${{ matrix.asset_suffix }}${{ matrix.exe_ext }}"

          tebako press `
            --root=. `
            --entry-point=bin/wayback_machine_downloader `
            --output="$outPath" `
            -R $env:RUBY_VERSION `
            -m self-contained `
            --format dwarfs

          "ASSET_PATH=$outPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wayback-machine-downloader-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET_PATH }}

  release:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Show generated assets
        run: ls -lah release-assets

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: release-assets/*